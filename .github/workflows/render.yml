name: Render video

# 手动触发：GitHub 仓库 Actions 页 -> Render video -> Run workflow
# 想省额度就用手动触发；push 自动渲染默认关闭（删掉 Render 那步的 if 行即可打开）
on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Composition ID（见 src/Root.tsx）"
        required: true
        default: "Film"
      concurrency:
        description: "并行渲染标签数（4 核用 3，偶发崩溃就降到 2）"
        required: true
        default: "3"
      footage:
        description: "实拍素材：release=从 Release footage-1 下载；none=不出实拍层"
        required: true
        default: "none"
  push:
    branches: [main]

concurrency:
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Remotion browser (Chrome Headless Shell)
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            remotion-browser-${{ runner.os }}-

      - name: Fetch footage (optional)
        if: github.event_name == 'workflow_dispatch' && inputs.footage == 'release'
        run: |
          mkdir -p public/footage
          BASE="https://github.com/${{ github.repository }}/releases/download/footage-1"
          for f in paintpour_1 paperswirl_1 pigment_2 fabric_2; do
            echo "downloading $f.mp4"
            curl -L --fail --retry 3 -o "public/footage/$f.mp4" "$BASE/$f.mp4"
          done
          ls -l public/footage

      - name: Render
        if: github.event_name == 'workflow_dispatch'
        env:
          COMPOSITION: ${{ inputs.composition || 'Film' }}
          CONCURRENCY: ${{ inputs.concurrency || '3' }}
          # 仓库里没有 public/footage（素材不走 Git），默认关掉实拍层，
          # 保证云端一定出片；素材上传到 public/footage 后把这里改成 'true'
          REMOTION_HAS_FOOTAGE: ${{ inputs.footage == 'release' && 'true' || (vars.REMOTION_HAS_FOOTAGE || 'false') }}
        run: |
          npx remotion render src/index.ts "$COMPOSITION" out/video.mp4 \
            --concurrency="$CONCURRENCY" \
            --log=verbose

      - name: Upload MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-output
          path: out/video.mp4
          retention-days: 3
          if-no-files-found: warn
